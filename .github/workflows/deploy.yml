name: Deploy na VPS

# A cada push na main, sincroniza o codigo com o servidor.
# NAO mexe em: loja-api/config/config.php (segredos do servidor) e loja-api/public/uploads/ (fotos enviadas).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Enviar arquivos (rsync)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -rlptz --delete \
            --chmod=D755,F644 \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='/LICENSE' \
            --exclude='/README.md' \
            --exclude='/loja-api/config/config.php' \
            --exclude='/loja-api/public/uploads/' \
            -e "ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            ./ "$VPS_USER@$VPS_HOST:/var/www/fakestore/"

      - name: Verificar se o site responde
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          curl -fsS -o /dev/null -w 'HTTP %{http_code}\n' --retry 5 --retry-delay 3 --retry-all-errors "http://$VPS_HOST/"
